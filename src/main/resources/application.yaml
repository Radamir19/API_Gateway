spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: api_gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: flowmanager
              uri: ${FLOW_MANAGER_URI}
              predicates:
                - Path=${FLOW_MANAGER_PATH}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: gateway
            client-secret: ${CLIENT_SECRET}
            client-name: gateway
            authorization-grant-type: authorization_code
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${OAUTH_ISSUER_URI}
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}
server:
  port: 8082
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    instance:
      instance-id: ${spring.application.name}:${server.port}
